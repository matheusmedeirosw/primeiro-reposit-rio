<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Maquinários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <span class="navbar-brand">
                Controle de Máquinas do IFTO - Campus Dianópolis
            </span>

            <a href="/logout" class="btn btn-danger">
                Sair
            </a>

        </div>

    </nav>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-4">

                <div class="card shadow p-4">

                    <h5>Total de Máquinas</h5>

                    <h1>
                        {{ total }}
                    </h1>

                </div>

            </div>

        </div>

        <div class="card shadow p-4 mt-4">

            <h3 class="mb-4">
                Cadastrar Máquina
            </h3>

            <form method="POST">

                <input
                    type="text"
                    name="nome"
                    placeholder="Nome da máquina"
                    class="form-control mb-3"
                >

                <button class="btn btn-success">
                    Cadastrar
                </button>

            </form>

        </div>

        <div class="card shadow p-4 mt-4">

            <h3 class="mb-4">
                Máquinas Cadastradas
            </h3>

            <table class="table">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    {% for maquina in maquinas %}

                    <tr>

                        <td>{{ maquina[0] }}</td>
                        <td>{{ maquina[1] }}</td>
                        <td>{{ maquina[2] }}</td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
